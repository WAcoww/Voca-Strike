<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>三角洲单词突击 | Delta Vocab Strike</title>
<style>
/* ═══════════════ 三角洲单词突击 — Dashboard UI ═══════════════ */
:root{
  --bg:#070c14;--bg-panel:rgba(12,18,28,0.82);--bg-card:rgba(255,255,255,0.025);
  --border:rgba(255,255,255,0.05);--border-light:rgba(255,255,255,0.08);
  --accent:#e8823a;--accent-dim:rgba(232,130,58,0.10);
  --green:#4ade80;--green-dim:rgba(74,222,128,0.06);
  --red:#f87171;--red-dim:rgba(248,113,113,0.06);
  --gold:#f0b830;--gold-dim:rgba(240,184,48,0.06);
  --text:#d5dce6;--text-secondary:#8896a6;--text-muted:#4a5568;
  --q-gray:#8896a6;--q-green:#4ade80;--q-blue:#60a5fa;--q-gold:#f0b830;--q-red:#f87171;
  --r:8px;--gap:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;touch-action:manipulation;-webkit-overflow-scrolling:none}
body{
  background:radial-gradient(ellipse at 50% 0%,#101e2e 0%,#080d16 55%,#050810 100%);
  color:var(--text);font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  font-size:14px;line-height:1.5;user-select:none;-webkit-user-select:none
}
/* 全局玻璃态 */
#game-container{width:100%;height:100%;max-width:1024px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:transparent}
#canvas-wrap{flex:0 0 56vh;min-height:320px;position:relative;background:transparent;border-bottom:1px solid rgba(255,255,255,0.06);overflow:hidden}
#canvas-wrap::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,130,58,0.4),transparent);pointer-events:none}
#battle-canvas{display:block;width:100%;height:100%}

/* HUD 玻璃底 */
#hud-panel{flex:1;min-height:180px;display:flex;flex-direction:column;padding:10px 16px;gap:8px;
  background:rgba(14,20,28,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid rgba(255,255,255,0.06);
  position:relative}
#hud-panel::before{content:'';position:absolute;top:0;left:20px;right:20px;height:1px;background:linear-gradient(90deg,transparent,var(--accent-dim),transparent);pointer-events:none}
#info-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--text-secondary);padding:6px 12px;background:rgba(255,255,255,0.02);border-radius:var(--r);border:1px solid var(--border)}
#info-bar .stat-val{color:var(--text);font-weight:600}
#info-bar .gold{color:var(--gold)}#info-bar .hp{color:var(--green)}#info-bar .wave-label{color:var(--accent)}
#word-area{text-align:center;padding:2px 0}
#word-display{display:inline-block;font-size:30px;font-weight:700;letter-spacing:3px;color:#fff;padding:8px 24px;border-radius:var(--r);background:var(--bg-card);border:1px solid var(--border-light);min-width:180px;transition:all 0.15s}
#word-display.cooling{color:var(--red);background:var(--red-dim);border-color:rgba(248,113,113,0.3);animation:shake 0.35s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#options-row{display:flex;gap:12px;justify-content:center;flex:1;align-items:flex-start}
.btn-option{flex:1;max-width:220px;padding:14px 10px;font-family:inherit;font-size:15px;font-weight:500;color:var(--text);background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--r);cursor:pointer;transition:all 0.12s;outline:none}
.btn-option:hover:not(:disabled){background:rgba(255,255,255,0.06);border-color:var(--accent)}
.btn-option:disabled{opacity:0.25;cursor:not-allowed}
.btn-option.correct-flash{background:var(--green-dim)!important;border-color:var(--green)!important;color:var(--green)!important}
.btn-option.wrong-flash{background:var(--red-dim)!important;border-color:var(--red)!important;color:var(--red)!important}
#speed-indicator{position:absolute;top:12px;right:16px;font-size:10px;font-weight:700;color:var(--gold);opacity:0;transition:opacity 0.2s;background:rgba(240,184,48,0.08);padding:2px 8px;border-radius:20px;border:1px solid rgba(240,184,48,0.15)}
#speed-indicator.show{opacity:1}
#backpack-bar{display:flex;align-items:center;gap:4px;padding:2px 8px;background:var(--bg-card);border-radius:var(--r);font-size:9px;color:var(--text-muted);border:1px solid var(--border-light)}
#backpack-items{display:flex;gap:3px;flex-wrap:wrap}
.bp-item{padding:1px 5px;border-radius:3px;font-size:8px;font-weight:600;background:rgba(255,255,255,0.04)}
.bp-item.white{color:var(--q-gray)}.bp-item.blue{color:var(--q-blue)}.bp-item.purple{color:#a78bfa}.bp-item.gold{color:var(--q-gold)}.bp-item.red{color:var(--q-red)}

#title-screen{position:absolute;inset:0;background:rgba(7,12,20,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
#title-screen h1{font-size:32px;font-weight:800;color:var(--accent);letter-spacing:5px;margin-bottom:2px;text-shadow:0 0 40px rgba(232,130,58,0.3)}
#title-screen .subtitle{font-size:11px;color:var(--text-muted);letter-spacing:8px;margin-bottom:48px}
#title-screen button{padding:16px 56px;font-family:inherit;font-size:15px;font-weight:600;color:var(--accent);background:transparent;border:1px solid rgba(232,130,58,0.4);border-radius:var(--r);cursor:pointer;letter-spacing:3px;transition:all 0.3s}
#title-screen button:hover{background:rgba(232,130,58,0.08);box-shadow:0 0 24px rgba(232,130,58,0.15)}

/* ═══ 藏身处 Dashboard ═══ */
#hideout-screen{position:absolute;inset:0;background:rgba(7,12,20,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;flex-direction:column;z-index:10}
#hideout-screen.active{display:flex}
.hideout-header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;flex-shrink:0;background:rgba(12,18,28,0.6);border-bottom:1px solid var(--border)}
.hideout-header h2{font-size:14px;font-weight:700;color:var(--accent);letter-spacing:3px}
.hideout-stats{display:flex;gap:16px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.hideout-stats .val{color:var(--text);font-weight:600}

/* Dashboard 主区域：上下分区 */
#dash-body{flex:1;overflow-y:auto;padding:var(--gap);display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.dash-top{display:flex;gap:var(--gap);flex-shrink:0}
.dash-panel{background:rgba(14,20,30,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:var(--r);padding:12px;position:relative;margin-bottom:14px}
.dash-top .dash-panel{flex:1}
.dash-panel h3{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
/* 装备迷你视图 */
.gear-mini{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.gear-mini .gm-item{display:flex;align-items:center;gap:6px;font-size:13px;padding:4px 6px;border-radius:3px;background:rgba(255,255,255,0.015)}
.gm-item .gm-icon{font-size:12px;flex-shrink:0}
.gm-item .gm-name{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-item .gm-empty{color:var(--text-muted);font-weight:400}
/* 信息面板 */
.info-list{display:flex;flex-direction:column;gap:4px;font-size:12px}
.info-list .il-row{display:flex;justify-content:space-between;align-items:center}
.il-row .il-label{color:var(--text-secondary)}
.il-row .il-val{color:var(--text);font-weight:600}

/* 仓库面板 */
.storage-scroll{display:flex;gap:6px;flex-wrap:wrap;max-height:90px;overflow-y:auto}
.storage-scroll .ss-item{padding:4px 8px;background:rgba(255,255,255,0.02);border:1px solid var(--border-light);border-radius:4px;font-size:12px;cursor:pointer;white-space:nowrap;transition:all 0.1s}
.ss-item:hover{border-color:var(--accent);background:var(--accent-dim)}
.shop-item{border-radius:5px;border:1px solid rgba(255,255,255,0.05);background:rgba(255,255,255,0.02);transition:all 0.1s;padding:6px 12px;font-size:13px}
.shop-item:hover{border-color:var(--accent);background:rgba(232,130,58,0.08)}
.ss-item .ss-q{font-weight:600}

/* 错词 */
.word-tags{display:flex;gap:4px;flex-wrap:wrap}
.word-tag{display:inline-block;padding:3px 9px;background:var(--red-dim);border-radius:3px;font-size:11px;cursor:pointer;border:1px solid rgba(248,113,113,0.2)}
.word-tag:hover{background:rgba(248,113,113,0.2)}

/* 部署按钮 */
.btn-deploy-wrap{flex-shrink:0;padding:0 var(--gap) var(--gap)}
.btn-deploy{display:block;width:100%;padding:16px;font-family:inherit;font-size:15px;font-weight:700;
  color:var(--accent);background:rgba(232,130,58,0.04);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  border:1px solid rgba(232,130,58,0.3);border-radius:var(--r);cursor:pointer;letter-spacing:4px;
  transition:all 0.3s;position:relative}
.btn-deploy::after{content:'';position:absolute;inset:-1px;border-radius:var(--r);background:linear-gradient(135deg,transparent 60%,rgba(232,130,58,0.08));pointer-events:none}
.btn-deploy:hover{background:rgba(232,130,58,0.12);box-shadow:0 0 30px rgba(232,130,58,0.2),0 0 60px rgba(232,130,58,0.06);transform:translateY(-2px)}

/* ═══ 部署弹窗（递进流程） ═══ */
#deploy-modal{position:absolute;inset:0;background:rgba(7,12,20,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:25}
#deploy-modal.active{display:flex}
.deploy-step{text-align:center;width:100%;max-width:520px;padding:24px}
.deploy-step h2{font-size:18px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:4px}
.deploy-step .step-desc{font-size:11px;color:var(--text-secondary);margin-bottom:20px}
.deploy-step .step-cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:20px}
.deploy-step .step-card{padding:16px 18px;background:rgba(255,255,255,0.025);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;min-width:130px;text-align:center;transition:all 0.2s}
.deploy-step .step-card:hover{border-color:var(--accent);background:rgba(232,130,58,0.06);transform:translateY(-2px)}
.deploy-step .step-card.chosen{border-color:var(--accent);background:rgba(232,130,58,0.08);box-shadow:0 0 16px rgba(232,130,58,0.1)}
.deploy-step .step-card .sc-title{font-size:13px;font-weight:700;margin-bottom:2px}
.deploy-step .step-card .sc-sub{font-size:10px;color:var(--text-secondary)}
.deploy-step .step-nav{display:flex;gap:10px;justify-content:center}
.deploy-step .step-nav button{padding:10px 28px;font-family:inherit;font-size:13px;font-weight:600;border-radius:var(--r);cursor:pointer;transition:all 0.15s}
.btn-back{color:var(--text-secondary);background:transparent;border:1px solid var(--border)}
.btn-back:hover{color:var(--text);border-color:var(--text-secondary)}
.btn-next{color:var(--accent);background:transparent;border:1.5px solid var(--accent)}
.btn-next:hover{background:var(--accent-dim)}
.btn-next:disabled{opacity:0.3;cursor:not-allowed}

/* overlay/loot保持不变 */
#overlay{position:absolute;inset:0;background:rgba(7,12,20,0.95);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#overlay.active{display:flex}
.overlay-text{font-size:28px;font-weight:800;letter-spacing:3px;margin-bottom:10px;white-space:pre-line;text-align:center}
.overlay-sub{font-size:13px;color:var(--text-secondary);margin-bottom:28px;white-space:pre-line;text-align:center}
.overlay-btn{padding:14px 40px;font-family:inherit;font-size:14px;font-weight:600;color:var(--accent);background:transparent;border:1px solid rgba(232,130,58,0.4);border-radius:var(--r);cursor:pointer;transition:all 0.3s}
.overlay-btn:hover{background:rgba(232,130,58,0.1)}

#loot-overlay{position:absolute;inset:0;background:rgba(8,13,20,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:15}
#loot-overlay.active{display:flex}
.loot-title{font-size:16px;font-weight:700;color:var(--accent);letter-spacing:2px;margin-bottom:24px}
.loot-grid{display:flex;gap:14px}
.loot-container{width:88px;height:88px;background:var(--bg-card);border:2px solid var(--border);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:28px;color:var(--text-secondary);transition:all 0.15s}
.loot-container:hover{border-color:var(--accent);transform:scale(1.06)}
.loot-container .loot-label{font-size:9px;color:var(--text-muted);margin-top:4px}

#defend-banner{position:absolute;top:6%;left:50%;transform:translateX(-50%);font-size:15px;font-weight:800;color:var(--red);display:none;z-index:5;pointer-events:none;letter-spacing:3px;background:rgba(0,0,0,0.7);padding:4px 18px;border-radius:4px;border:1px solid rgba(248,113,113,0.3)}
#defend-banner.active{display:block;animation:pulse-defend 0.5s infinite alternate}
@keyframes pulse-defend{from{opacity:0.8}to{opacity:1}}
@keyframes loot-pop{0%{transform:translate(-50%,-50%)scale(0.3);opacity:0}60%{transform:translate(-50%,-50%)scale(1.15);opacity:1}100%{transform:translate(-50%,-50%)scale(1);opacity:1}}
.loot-popup{position:absolute;top:40%;left:50%;font-size:20px;font-weight:800;z-index:16;pointer-events:none;animation:loot-pop 0.5s ease-out forwards}

@media(max-width:640px){#canvas-wrap{flex:0 0 40vh;min-height:200px}#word-display{font-size:20px}.btn-option{font-size:13px;padding:10px 4px}.dash-top{flex-direction:column}}
</style>
</head>
<body>
<div id="game-container">
<div id="canvas-wrap"><canvas id="battle-canvas"></canvas></div>
<div id="hud-panel">
<div id="info-bar">
<span>💰<span class="stat-val gold" id="gold-display">0</span></span><span>❤️<span class="stat-val hp" id="hp-display">200</span></span><span class="wave-label" id="wave-display">准备出发</span><span>⚔️<span class="stat-val" id="atk-display">22</span></span><span>🛡️<span class="stat-val" id="def-display">0%</span></span><span id="mode-indicator" style="color:var(--green)">🟢普通</span>
</div>
<div id="word-area"><div id="word-display">等待敌人出现...</div></div>
<div id="options-row">
<button class="btn-option" id="btn0" disabled>---</button><button class="btn-option" id="btn1" disabled>---</button><button class="btn-option" id="btn2" disabled>---</button>
</div>
<div id="speed-indicator">⚡×3</div>
<div id="backpack-bar"><span>🎒</span><div id="backpack-items"></div></div>
</div>

<div id="title-screen"><h1>🔺 三角洲单词突击</h1><div class="subtitle">SEARCH · FIGHT · EXTRACT</div><button onclick="Game.startGame()">部 署 行 动</button></div>

<div id="hideout-screen">
<div class="hideout-header"><h2>安全屋 v2</h2><div class="hideout-stats">💰<span class="val" id="ho-gold">0</span> ❤️<span class="val" id="ho-hp">200/200</span> ⚔️<span class="val" id="ho-atk">22</span> 🎯<span class="val" id="ho-zone">-</span></div></div>
<div id="dash-body"></div>
<div class="btn-deploy-wrap"><button class="btn-deploy" onclick="Game.openDeployModal()">🚁 部 署 行 动</button></div>
</div>

<!-- 部署递进弹窗 -->
<div id="deploy-modal">
<div class="deploy-step" id="deploy-step1">
<h2>📍 选择任务区域</h2><div class="step-desc">难度越高回报越大，但风险也越大</div>
<div class="step-cards" id="zone-cards"></div>
<div class="step-nav"><button class="btn-back" onclick="Game.closeDeployModal()">取消</button><button class="btn-next" id="zone-next" disabled onclick="Game.deployStep2()">下一步 ▶</button></div>
</div>
<div class="deploy-step" id="deploy-step2" style="display:none">
<h2>🎖️ 确认装备配置</h2><div class="step-desc">检查装备，可快速切换</div>
<div id="gear-check" style="text-align:left;max-width:350px;margin:0 auto 16px;font-size:11px"></div>
<div class="step-nav"><button class="btn-back" onclick="Game.deployStep1()">◀ 返回</button><button class="btn-next" onclick="Game.deployStep3()">下一步 ▶</button></div>
</div>
<div class="deploy-step" id="deploy-step3" style="display:none">
<h2>✅ 确认出发</h2><div class="step-desc" id="deploy-summary"></div>
<div class="step-nav"><button class="btn-back" onclick="Game.deployStep2()">◀ 返回</button><button class="btn-next" onclick="Game.deployConfirm()">🚁 出发！</button></div>
</div>
</div>

<div id="overlay"><div class="overlay-text" id="overlay-title"></div><div class="overlay-sub" id="overlay-sub"></div><button class="overlay-btn" id="overlay-btn" onclick="Game.overlayAction()">确定</button></div>
<div id="loot-overlay"><div class="loot-title">📦 搜索物资</div><div class="loot-grid"><div class="loot-container" onclick="Game.pickLoot(0)">📦<span class="loot-label">木箱</span></div><div class="loot-container" onclick="Game.pickLoot(1)">🎒<span class="loot-label">背包</span></div><div class="loot-container" onclick="Game.pickLoot(2)">🧰<span class="loot-label">工具箱</span></div></div></div>
<div id="defend-banner">⚠ 坚守阵地 ⚠</div>
</div>

<script>

showLootPopup(item){const el=document.createElement('div');el.className='loot-popup';el.style.color=item.color;el.textContent=item.emoji+' '+item.name;document.getElementById('game-container').appendChild(el);setTimeout(()=>el.remove(),1100);},
addWrongWord(word){if(!word)return;if(!this.wrongWords.some(w=>w.en===word.en))this.wrongWords.push({en:word.en,zh:word.zh,level:word.level});},

_spawnDefendWave(){this._defendWave++;this.enemyType='elite';this.enemyName=`增援#${this._defendWave}`;this.enemyMaxHp=Math.round(150);this.enemyHp=this.enemyMaxHp;this.enemyAtk=Math.round(13);this.waveTimer=0;this.answered=false;this.canAnswer=false;this.cooldownTimer=0;if(this.nextWordTimeout){clearTimeout(this.nextWordTimeout);this.nextWordTimeout=null;}setTimeout(()=>this.nextWord(),400);},

update(dt){
if(this.state==='TITLE'||this.state==='HIDEOUT'||this.state==='LOOTING')return;
if(this.state==='DEFEAT'||this.state==='VICTORY')return;const rd=Math.min(dt,0.12);
if(this.screenShake>0)this.screenShake=Math.max(0,this.screenShake-rd*8);
if(this.playerMuzzleFlash>0)this.playerMuzzleFlash=Math.max(0,this.playerMuzzleFlash-rd*16);
if(this.enemyMuzzleFlash>0)this.enemyMuzzleFlash=Math.max(0,this.enemyMuzzleFlash-rd*16);
if(this._enemyDeathTimer>0)this._enemyDeathTimer=Math.max(0,this._enemyDeathTimer-rd);
if(this._headshotFlash>0)this._headshotFlash=Math.max(0,this._headshotFlash-rd);
if(this.cooldownTimer>0){this.cooldownTimer-=rd;if(this.cooldownTimer<=0&&!this.answered&&(this.state==='FIGHTING'||this.state==='BOSS'||this.state==='DEFEND'))this.nextWord();}
if(this.canAnswer&&!this.answered){this.questionTimer+=rd;if(this.questionTimer>3&&this.speedBonus>2){this.speedBonus=2;this.updateOptBtns();}if(this.questionTimer>6&&this.speedBonus>1){this.speedBonus=1;this.updateOptBtns();}}
if(this.state==='ADVANCING'){this.waveTimer+=rd;this.bgScroll+=rd*220;if(this.waveTimer>=this.waveDuration){this.advanceCount++;if(this.advanceCount%3===0){this.enterLootPhase();return;}this.wave++;this.wavePhase='fighting';if(this.wave>=this.totalWaves){this.setState('VICTORY');this.showOverlay('🏆 任务完成！','收益 💰'+this.totalGoldEarned,'返回安全屋',()=>{document.getElementById('overlay').classList.remove('active');this.level++;this.hp=Math.min(this.getMaxHp(),this.hp+30);this.missionGold=0;this.openHideout();});return;}this.spawnWaveEnemy();setTimeout(()=>this.nextWord(),500);}}
if(this.state==='DEFEND'){
if(this._defendEnterTimer>0){this._defendEnterTimer-=rd;if(this._defendEnterTimer<=0){this._defendEnterTimer=0;this._spawnDefendWave();}this.defendTimer-=rd;}
else{this.defendTimer-=rd;document.getElementById('defend-banner').textContent=`⚠ 坚守阵地 · ${Math.ceil(Math.max(0,this.defendTimer))}s`;if(this._defendCooldown>0){this._defendCooldown-=rd;if(this._defendCooldown<=0&&this.defendTimer>5)this._spawnDefendWave();}if(this._defendKilled){this._defendKilled=false;this._defendCooldown=6;this.canAnswer=false;this.cooldownTimer=0;if(this.nextWordTimeout){clearTimeout(this.nextWordTimeout);this.nextWordTimeout=null;}document.getElementById('word-display').textContent='防线稳住 · 等待下一波...';this.disableBtns();}}
this.bgScroll+=rd*20;
if(this.defendTimer<=0){document.getElementById('defend-banner').classList.remove('active');this.setState('EXTRACTING');this.extractTimer=this.extractDuration;this.canAnswer=false;this.disableBtns();document.getElementById('word-display').textContent='🚁 直升机就位...';}}
if(this.state==='EXTRACTING'){this.extractTimer-=rd;this.bgScroll+=rd*260;if(this.extractTimer<=this.extractDuration-1)document.getElementById('word-display').textContent=`🚁 撤离中 · ${Math.ceil(Math.max(0,this.extractTimer))}s`;if(this.extractTimer<=0){this.setState('VICTORY');this.showOverlay('✅ 撤离成功','任务 💰'+this.totalGoldEarned,'返回安全屋',()=>{document.getElementById('overlay').classList.remove('active');this.level++;this.hp=Math.min(this.getMaxHp(),this.hp+40);this.missionGold=0;this.openHideout();});}}
if(this.state==='FIGHTING'||this.state==='BOSS')this.bgScroll+=rd*45;
if((this.state==='FIGHTING'||this.state==='BOSS'||this.state==='DEFEND')&&this.enemyHp>0){this.playerShootTimer+=rd;this.enemyShootTimer+=rd;if(this.playerShootTimer>=0.48){this.playerShootTimer=0;this.firePlayerShot();}if(this.enemyShootTimer>=0.5){this.enemyShootTimer=0;this.fireEnemyShot();}}
this.updateParticles(rd);this.updateBullets(rd);this.updateDmgNums(rd);},

firePlayerShot(){if(W<=0||H<=0)return;const sx=this.state==='DEFEND'?W*0.73:W*0.27,sy=H*0.48;const dir=this.state==='DEFEND'?-1:1;const ex=sx+dir*(W*0.46+(Math.random()-0.5)*28),ey=H*0.46+(Math.random()-0.5)*18;this.bullets.push({x:sx,y:sy,tx:ex,ty:ey,progress:0,speed:9,isPlayer:true});this.playerMuzzleFlash=Math.max(this.playerMuzzleFlash,4);},
fireEnemyShot(){if(W<=0||H<=0)return;const sx=this.state==='DEFEND'?W*0.22:W*0.73,sy=H*0.46;const ex=this.state==='DEFEND'?W*0.78+(Math.random()-0.5)*18:W*0.27+(Math.random()-0.5)*18,ey=H*0.48+(Math.random()-0.5)*18;this.bullets.push({x:sx,y:sy,tx:ex,ty:ey,progress:0,speed:7,isPlayer:false});this.enemyMuzzleFlash=Math.max(this.enemyMuzzleFlash,3);const ad=1+Math.floor(Math.random()*3);const a=this.getReducedDamage(ad);this.hp-=a;this.vestDurabilityLoss(ad);if(this.hp<=0){this.hp=0;this.onPlayerDefeated();}this.refreshHUD();if(a>0)this.addDmgNum(a,true);},

addDmgNum(dmg,ip){if(W<=0)return;const x=ip?(this.state==='DEFEND'?W*0.78:W*0.25):(this.state==='DEFEND'?W*0.22:W*0.75),y=H*0.28;const c=ip?'#f87171':'#f0b830';this.damageNumbers.push({x:x+(Math.random()-0.5)*50,y,text:(ip?'-':'')+dmg,life:1.1,color:c,vy:-42});},
addFloatingText(t,x,y,c){this.damageNumbers.push({x,y,text:t,life:1.5,color:c,vy:-30});},
updateParticles(dt){for(let i=this.particles.length-1;i>=0;i--){const p=this.particles[i];p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=5*dt;p.life-=dt;if(p.life<=0)this.particles.splice(i,1);}},
updateBullets(dt){for(let i=this.bullets.length-1;i>=0;i--){const b=this.bullets[i];b.progress+=b.speed*dt;if(b.progress>=1){for(let j=0;j<5;j++)this.particles.push({x:b.tx,y:b.ty,vx:(Math.random()-0.5)*7,vy:(Math.random()-0.5)*7,life:0.25+Math.random()*0.2,color:Math.random()>0.5?'#ffa726':'#ff7043',size:1.5+Math.random()*2.5});this.bullets.splice(i,1);}}},
updateDmgNums(dt){for(let i=this.damageNumbers.length-1;i>=0;i--){const d=this.damageNumbers[i];d.y+=d.vy*dt;d.life-=dt;if(d.life<=0)this.damageNumbers.splice(i,1);}},

showOverlay(title,sub,btn,act){document.getElementById('overlay').classList.add('active');document.getElementById('overlay-title').textContent=title;document.getElementById('overlay-sub').textContent=sub;document.getElementById('overlay-btn').textContent=btn;this._overlayAction=act;},
overlayAction(){if(this._overlayAction)this._overlayAction();},

render(){if(this.state==='TITLE'||this.state==='HIDEOUT'||this.state==='LOOTING')return;if(W<=0||H<=0)return;ctx.clearRect(0,0,W,H);let sx=0,sy=0;if(this.screenShake>0){sx=(Math.random()-0.5)*this.screenShake*3;sy=(Math.random()-0.5)*this.screenShake*3;}ctx.save();ctx.translate(sx,sy);this.drawBg();this.drawChars();this.drawBullets();this.drawParticles();this.drawDmgNums();this.drawBars();
if(this._headshotFlash>0){ctx.fillStyle=`rgba(251,191,36,${this._headshotFlash*0.25})`;ctx.fillRect(0,0,W,H);}
ctx.restore();},
drawBg(){const sky=ctx.createLinearGradient(0,0,0,H*0.62);sky.addColorStop(0,'#1a2a3a');sky.addColorStop(0.45,'#2d4a5a');sky.addColorStop(1,'#4a6a5a');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*0.64);ctx.fillStyle='#1a2a1a';ctx.beginPath();const s=this.bgScroll%W;ctx.moveTo(-2,H*0.64);for(let x=-s-100;x<W+200;x+=120)ctx.lineTo(x+70,H*0.64-H*0.08-Math.sin(x*0.008)*H*0.04);ctx.lineTo(W+200,H*0.70);ctx.lineTo(-200,H*0.70);ctx.fill();const gnd=ctx.createLinearGradient(0,H*0.60,0,H);gnd.addColorStop(0,'#5a4e30');gnd.addColorStop(0.3,'#4a3e22');gnd.addColorStop(1,'#2a1e10');ctx.fillStyle=gnd;ctx.fillRect(0,H*0.60,W,H*0.40);ctx.fillStyle='#3a2e18';[0.08,0.17,0.26,0.38,0.49,0.61,0.74,0.88].forEach(o=>{const sx=((o*W+this.bgScroll*0.4)%W+W)%W;ctx.fillRect(sx,H*0.64,5,2);});},
drawChars(){const groundY=H*0.62,st=this.state;const ea=this.enemyHp>0||(this._enemyDeathTimer&&this._enemyDeathTimer>0);const df=this._enemyDeathTimer>0&&Math.sin(this._enemyDeathTimer*40)>0;if(st==='DEFEND'){if(this._defendEnterTimer>0){const t=1-this._defendEnterTimer/0.8;this.drawOperator(W*0.20+(W*0.58)*t,groundY-18,t>0.5);}else if(this._defendCooldown>0){this.drawOperator(W*0.78,groundY-18,true);}else{this.drawOperator(W*0.78,groundY-18,true);if(ea)this.drawEnemy(W*0.22,groundY-10,this.enemyType,true,df);}}else if(st==='ADVANCING'){this.drawOperator(W*0.20,groundY-18,false);}else if(st==='EXTRACTING'){this.drawOperator(W*0.78,groundY-18,true);}else if(st==='FIGHTING'||st==='BOSS'){this.drawOperator(W*0.20,groundY-18,false);if(ea)this.drawEnemy(W*0.78,groundY-10,this.enemyType,false,df);}},
drawOperator(x,y,fl){ctx.save();ctx.translate(x,y);if(fl)ctx.scale(-1,1);ctx.fillStyle='#3a5a2a';ctx.fillRect(-10,-22,20,26);ctx.fillStyle='#2a4a1a';ctx.fillRect(-9,-18,18,16);ctx.fillStyle='#d4a574';ctx.fillRect(-6,-40,12,16);ctx.fillStyle='#4a5a3a';ctx.beginPath();ctx.arc(0,-32,12,Math.PI,0);ctx.fill();ctx.fillStyle='#2d2a1a';ctx.fillRect(-7,4,6,14);ctx.fillRect(2,4,6,14);ctx.fillStyle='#3a3a3a';ctx.fillRect(12,-14,30,5);ctx.fillRect(38,-17,8,10);if(this.playerMuzzleFlash>1){ctx.fillStyle=`rgba(255,210,60,${this.playerMuzzleFlash/6})`;ctx.beginPath();ctx.arc(46,-12,4+this.playerMuzzleFlash*3,0,Math.PI*2);ctx.fill();}ctx.restore();},
drawEnemy(x,y,type,fr,df){if(df)return;ctx.save();ctx.translate(x,y);const sc=type==='boss'?1.5:(type==='elite'?1.2:1);ctx.scale(fr?-sc:sc,sc);if(this._enemyDeathTimer>0){ctx.globalAlpha=this._enemyDeathTimer/0.4;ctx.fillStyle='rgba(255,0,0,0.3)';ctx.fillRect(-35,-45,70,60);ctx.globalAlpha=1;}const body=type==='boss'?'#6a1a1a':(type==='elite'?'#5a3a1a':'#4a3a2a');ctx.fillStyle=body;ctx.fillRect(-10,-20,20,24);ctx.fillStyle=type==='boss'?'#4a1010':(type==='elite'?'#4a2a0a':'#3a2a1a');ctx.fillRect(-7,-34,14,16);ctx.fillStyle='#2a1a0a';ctx.fillRect(3,-2,5,9);ctx.fillRect(-8,-2,5,9);ctx.fillStyle='#ff3333';ctx.fillRect(-4,-30,2,2);ctx.fillRect(2,-30,2,2);ctx.fillStyle='#2a2a2a';ctx.fillRect(-30,-16,14,4);ctx.fillRect(-33,-18,4,8);if(this.enemyMuzzleFlash>1){ctx.fillStyle=`rgba(255,200,50,${this.enemyMuzzleFlash/8})`;ctx.beginPath();ctx.arc(-33,-14,3+this.enemyMuzzleFlash*2,0,Math.PI*2);ctx.fill();}if(type==='boss'){ctx.fillStyle='#ff2222';ctx.fillRect(-9,-36,18,3);}if(type==='elite'){ctx.fillStyle='#f0b040';ctx.fillRect(-6,-34,12,2);}ctx.restore();},
drawBullets(){this.bullets.forEach(b=>{const cx=b.x+(b.tx-b.x)*b.progress,cy=b.y+(b.ty-b.y)*b.progress;ctx.fillStyle=b.isPlayer?'rgba(255,210,80,0.4)':'rgba(255,70,30,0.4)';ctx.fillRect(cx-10,cy-0.5,10,1);ctx.fillStyle=b.isPlayer?'#ffc830':'#ff4428';ctx.fillRect(cx-2,cy-1,8,2);});},
drawParticles(){this.particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/0.7);ctx.fillStyle=p.color;ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);});ctx.globalAlpha=1;},
drawDmgNums(){this.damageNumbers.forEach(d=>{ctx.globalAlpha=Math.max(0,d.life/1.1);ctx.fillStyle=d.color;ctx.font='bold 16px system-ui,sans-serif';ctx.fillText(d.text,d.x,d.y);});ctx.globalAlpha=1;},
drawBars(){const bw=170,bh=16,pad=14,px=pad,py=H-bh-pad-4;this.drawBar(px,py,bw,bh,this.hp,this.getMaxHp(),'green');ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font='bold 10px system-ui,sans-serif';ctx.fillText('干员',px,py-6);const ex=W-bw-pad,ey=H-bh-pad-4;this.drawBar(ex,ey,bw,bh,this.enemyHp,this.enemyMaxHp,'enemy');ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='10px system-ui,sans-serif';ctx.textAlign='right';ctx.fillText(this.enemyName,W-pad,ey-6);ctx.textAlign='left';if(this.vest&&this.vest.currentDur>0){const aw=130,ay=py-14;ctx.fillStyle='#0a0604';ctx.fillRect(px,ay,aw,8);ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.strokeRect(px,ay,aw,8);ctx.fillStyle='#6a8ab0';ctx.fillRect(px+1,ay+1,(aw-2)*(this.vest.currentDur/this.vest.durability),6);ctx.fillStyle='#8a7a60';ctx.font='7px system-ui,sans-serif';ctx.fillText(`护甲 ${this.vest.currentDur}/${this.vest.durability}`,px+3,ay+7);}},
drawBar(x,y,w,h,cur,max,kind){ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(x,y,w,h);ctx.strokeStyle='rgba(255,255,255,0.12)';ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);const pct=Math.max(0,cur/max),c=kind==='enemy'?(pct>0.5?'#f0873e':'#f87171'):(pct>0.5?'#4ade80':(pct>0.25?'#f0b830':'#f87171'));ctx.fillStyle=c;ctx.fillRect(x+2,y+2,Math.max(0,(w-4)*pct),h-4);ctx.fillStyle='#fff';ctx.font='bold 10px system-ui,sans-serif';ctx.fillText(`${cur}/${max}`,x+w/2-22,y+h-3);},

_lastTime:0,loop(time){const dt=this._lastTime?Math.min((time-this._lastTime)/1000,0.1):0.016;this._lastTime=time;resizeCanvas();Game.update(dt);Game.render();requestAnimationFrame(t=>Game.loop(t));}};

document.getElementById('btn0').addEventListener('click',()=>Game.selectAnswer(0));
document.getElementById('btn1').addEventListener('click',()=>Game.selectAnswer(1));
document.getElementById('btn2').addEventListener('click',()=>Game.selectAnswer(2));
document.addEventListener('keydown',e=>{if(Game.canAnswer&&!Game.answered){if(e.key==='1'||e.key==='a'||e.key==='A')Game.selectAnswer(0);if(e.key==='2'||e.key==='s'||e.key==='S')Game.selectAnswer(1);if(e.key==='3'||e.key==='d'||e.key==='D')Game.selectAnswer(2);}if(e.key==='r'||e.key==='R')Game.retreat();if(e.key==='Escape'){if(document.getElementById('deploy-modal').classList.contains('active'))Game.closeDeployModal();}
if(e.ctrlKey&&e.shiftKey&&e.key==='H'){e.preventDefault();Game._debugHeadshot=!Game._debugHeadshot;document.getElementById('word-display').textContent=Game._debugHeadshot?'💀 调试爆头ON':'调试爆头OFF';setTimeout(()=>{if(Game.state!=='TITLE')Game.refreshHUD();},800);}});
resizeCanvas();requestAnimationFrame(t=>Game.loop(t));
</script>
